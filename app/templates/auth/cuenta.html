<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta · Habits</title>
</head>
<body>
  <main>
    <h1>Mi cuenta</h1>
    <p>{{ user.nombre }} · {{ user.rol }}</p>
    <p>{{ user.email }}</p>
    {% if user.rol == 'administrador' %}
      <p><a href="{{ url_for('auth.register') }}">Registrar personal</a></p>
    {% endif %}
    {% if user.rol in ['administrador', 'gerente'] %}
      <p><a href="{{ url_for('comparacion.sucursales') }}">Consultar datos por sucursal</a></p>
    {% endif %}
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Cerrar sesión</button>
    </form>
  </main>
</body>
</html>
