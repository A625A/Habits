{% extends "base.html" %}
{% block title %}Registrar personal · Habits{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="card-body">
        <p class="eyebrow mb-2">Administración</p>
        <h1 class="h2 mb-3">Registrar personal</h1>
        <p class="text-secondary mb-4">Crea una cuenta y asigna su rol y sucursal de adscripción.</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" name="nombre" maxlength="120" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Correo</label>
            <input class="form-control" id="email" type="email" name="email" maxlength="254" autocomplete="off" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required>
            <div class="form-text">Debe tener entre 12 y 128 caracteres.</div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label" for="rol">Rol</label>
              <select class="form-select text-capitalize" id="rol" name="rol" required>
                {% for rol in roles %}
                  <option value="{{ rol }}"{% if rol == 'mesero' %} selected{% endif %}>{{ rol }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="sucursal_id">Sucursal</label>
              <select class="form-select" id="sucursal_id" name="sucursal_id" required>
                {% for branch in branches %}
                  <option value="{{ branch.sucursal_id }}">{{ branch.nombre }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary" type="submit">Registrar</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('auth.account') }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
