{% extends "base.html" %}
{% block title %}Iniciar sesión · Habits{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="card-body">
        <p class="eyebrow mb-2">Acceso del personal</p>
        <h1 class="h2 mb-3">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Ingresa con tu usuario o correo asignado.</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label" for="email">Usuario o correo</label>
            <input class="form-control" id="email" type="text" name="email" autocomplete="username" maxlength="254" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <p class="small text-secondary mt-4 mb-0">El alta de personal la realiza un administrador.</p>
      </div>
    </div>
  </div>
{% endblock %}
